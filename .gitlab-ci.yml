stages:          # List of stages for jobs, and their order of execution
  - resilience-test

chaos-resilience-test:
  stage: resilience-test
  image: ubuntu:22.04
  variables:
    HARNESS_URL: "https://app.harness.io"
    HARNESS_ACCOUNT_ID: "EeRjnXTnS4GrLG5VNNJZUw"
    HARNESS_ORG_ID: "demo"
    HARNESS_PROJECT_ID: "Platform_Engineering"
    HARNESS_EXPERIMENT_ID: "b94ec985-757f-4e7e-8eb1-2170115d057b"
  before_script:
    - apt-get update && apt-get install -y curl jq
    - curl -sL https://app.harness.io/public/shared/tools/chaos/hce-cli/0.0.8/hce-cli-0.0.8-linux-amd64 -o hce-cli
    - chmod +x hce-cli
    - file ./hce-cli   # sanity check: confirms it's a valid ELF executable
  script:
    - ./hce-cli experiment run
      --account-id="$HARNESS_ACCOUNT_ID"
      --org-id="$HARNESS_ORG_ID"
      --project-id="$HARNESS_PROJECT_ID"
      --experiment-id="$HARNESS_EXPERIMENT_ID"
      --api-key="$HARNESS_API_KEY"
      --expected-res-score="${EXPECTED_RES_SCORE:-80}"
      --timeout 300
      --interactive=false
      --monitor=true

