pipeline:
  id: pipeline_GitHossamHamdy_nodejs_app_build_c038
  name: pipeline_GitHossamHamdy_nodejs_app_build_c038
  description: Builds and tests the Node.js app, publishes the Docker image to
    Docker Hub, then deploys it to Kubernetes.
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Setup Node
          id: setup_node
          run:
            shell: bash
            script: |-
              # Install nvm
              export NVM_DIR="$HOME/.nvm"
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              # Load nvm
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
              # Install Node.js version from .node-version
              nvm install
              nvm use
              node --version
              npm --version
              # Make nvm available in subsequent steps
              echo "export NVM_DIR=\"$HOME/.nvm\"" >> /harness/.node_env
              echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> /harness/.node_env
              echo "nvm use --silent" >> /harness/.node_env
        - name: Install Dependencies
          id: install_dependencies
          run:
            shell: bash
            script: |-
              source /harness/.node_env
              node --version
              npm ci
        - name: Run Tests
          id: run_tests
          run:
            shell: bash
            script: |-
              source /harness/.node_env
              mkdir -p .harness/reports
              npm install --no-save mocha-junit-reporter
              MOCHA_FILE=.harness/reports/junit.xml npx mocha --exit --reporter mocha-junit-reporter
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
        - name: Build and Push to Docker Hub
          id: build_and_push_docker
          build:
            uses: buildAndPushToDocker
            with:
              connector: connector_DockerRegistry_db17
              repo: hossameldinhamdy2008/test-repo
              tags:
                - latest
    - name: Deploy to Kubernetes
      id: deploy_to_kubernetes
      environment:
        items:
          - id: dev
            deploy-to: dev_k8s_infra
      steps:
        - name: Kubernetes Rolling Deploy
          id: k8sRollingDeployStep
          template:
            uses: k8sRollingDeployStep
      rollback:
        - group:
            steps:
              - name: Kubernetes Rolling Rollback
                id: k8sRollingRollbackStep
                template:
                  uses: k8sRollingRollbackStep
          id: k8sRollingRollback
          name: Kubernetes Rolling Rollback
      on-failure:
        errors: all
        action: stage-rollback
  tags:
    onboarding: "true"
    ai_generated: ""
